components:
  schemas:
    JSONAPIErrorObject:
      description: Serializer for a single JSON:API error object.
      example:
        code: code
        meta:
          key: ""
        detail: detail
        source: ""
        title: title
        status: status
      properties:
        status:
          description: The HTTP status code applicable to this problem
          maxLength: 3
          minLength: 3
          type: string
        code:
          description: An application-specific error code
          maxLength: 5
          minLength: 5
          type: string
        title:
          description: "A short, human-readable summary of the problem"
          maxLength: 4096
          minLength: 1
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of
            the problem
          maxLength: 4096
          minLength: 1
          type: string
        source:
          allOf:
          - $ref: "#/components/schemas/JSONAPIErrorSource"
          description: References to the primary source of the error
        meta:
          additionalProperties: {}
          description: Non-standard meta-information about the error
          type: object
      type: object
    JSONAPIErrorResponse:
      description: Serializer for a JSON:API error response.
      example:
        errors:
        - code: code
          meta:
            key: ""
          detail: detail
          source: ""
          title: title
          status: status
        - code: code
          meta:
            key: ""
          detail: detail
          source: ""
          title: title
          status: status
      properties:
        errors:
          description: Array of error objects
          items:
            $ref: "#/components/schemas/JSONAPIErrorObject"
          type: array
      required:
      - errors
      type: object
    JSONAPIErrorSource:
      description: Serializer for the 'source' object in a JSON:API error.
      properties:
        pointer:
          description: JSON Pointer to the value in the request document that caused
            the error
          maxLength: 4096
          minLength: 1
          type: string
        parameter:
          description: URI query parameter that caused the error
          maxLength: 4096
          minLength: 1
          type: string
        header:
          description: Request header name that caused the error
          maxLength: 4096
          minLength: 1
          type: string
      type: object
    LockoutPolicy:
      properties:
        active:
          type: boolean
        max_attempts:
          description: Maximum number of failed login attempts before lockout
          format: int64
          maximum: 100
          minimum: 1
          type: integer
        blocking_period:
          description: Blocking period in minutes
          format: int64
          type: integer
      required:
      - active
      - blocking_period
      - max_attempts
      type: object
    LockoutPolicyRequest:
      properties:
        active:
          type: boolean
        max_attempts:
          description: Maximum number of failed login attempts before lockout
          format: int64
          maximum: 100
          minimum: 1
          type: integer
        blocking_period:
          description: Blocking period in minutes
          format: int64
          type: integer
      required:
      - active
      - blocking_period
      - max_attempts
      type: object
    LoginRequest:
      example:
        password: password
        account_id: 0
        email: email
      properties:
        email:
          format: email
          minLength: 1
          type: string
          writeOnly: true
        password:
          description: User password
          maxLength: 128
          minLength: 1
          type: string
          writeOnly: true
